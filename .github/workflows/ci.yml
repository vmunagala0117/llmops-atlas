name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ATLAS_MOCK: "1"                     # no real model calls, no secrets needed
      ATLAS_MODELS: openai/atlas-ci-mock  # placeholder name; never sent to a provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Scan data for PII
        run: python scripts/scan_data.py      # data/ and docs/, no allowlist
      - name: Validate data
        run: python scripts/validate_data.py  # schema, shares, reproducible from seed 42
      - name: Run notebook
        run: >
          jupyter nbconvert --to notebook --execute
          notebooks/01_baseline_scorecard.ipynb --output-dir "$RUNNER_TEMP"
